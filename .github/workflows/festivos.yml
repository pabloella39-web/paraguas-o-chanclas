name: Festivos (nacionales y autonómicos)
on:
  schedule:
    - cron: "17 9 15 12 *"   # cada 15 de diciembre, el año siguiente
  workflow_dispatch:
permissions:
  contents: write
jobs:
  festivos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests && python scripts/festivos.py $(date +%Y) $(( $(date +%Y) + 1 ))
      - run: |
          git config user.name "parte-bot"; git config user.email "parte-bot@users.noreply.github.com"
          git add assets/festivos && (git diff --cached --quiet || git commit -m "Festivos del año")
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
