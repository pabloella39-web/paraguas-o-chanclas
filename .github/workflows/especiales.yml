name: Especiales del tiempo

on:
  schedule:
    # Avisos de AEMET: se comprueban cada 2 horas (si hay naranjas o rojos nuevos, vídeo especial)
    - cron: "23 6-20/2 * * *"
    # Fin de semana: viernes por la tarde (varios intentos; el primero que llega lo hace y espera a las 17:30)
    - cron: "11 14 * * 5"
    - cron: "41 14 * * 5"
    - cron: "11 15 * * 5"
    - cron: "41 15 * * 5"
    # La semana que viene: domingo por la noche (sale a las 20:30 de Madrid y hace también de parte del lunes)
    - cron: "41 17 * * 0"
    - cron: "11 18 * * 0"
    - cron: "41 18 * * 0"
    - cron: "11 19 * * 0"
    # Lo que queda de semana (+ finde): miércoles por la noche, a las 20:30 de Madrid (hace también de parte del jueves)
    - cron: "41 17 * * 3"
    - cron: "11 18 * * 3"
    - cron: "41 18 * * 3"
    - cron: "11 19 * * 3"
  push:
    # Lanzar a mano: escribir "finde" o "avisos" en lanzar_especial.txt (con "publicar" para subirlo)
    branches: [main]
    paths: ["lanzar_especial.txt"]

permissions:
  contents: write

concurrency:
  group: especiales
  cancel-in-progress: false

jobs:
  especial:
    runs-on: ubuntu-latest
    timeout-minutes: 220
    steps:
      - uses: actions/checkout@v4
      - name: Sincronizar con lo último de main (evita repetir lo que otra ejecución acaba de publicar)
        run: git fetch -q origin main && git reset -q --hard origin/main

      - name: ¿Qué especial toca?
        id: tipo
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            grep -qi finde lanzar_especial.txt && T=finde || T=avisos
            grep -qi semana lanzar_especial.txt && T=semana
            grep -qi resto lanzar_especial.txt && T=resto
            grep -qi publicar lanzar_especial.txt && P="--publicar" || P=""
            grep -qi esperar lanzar_especial.txt && P="$P --esperar"
          else
            # Viernes entre las 15:00 y las 18:30 (Madrid) → fin de semana; si no, revisión de avisos
            T=$(python3 -c "from datetime import datetime;from zoneinfo import ZoneInfo as Z;t=datetime.now(Z('Europe/Madrid'));c='${{ github.event.schedule }}'!='23 6-20/2 * * *';hm=(t.hour,t.minute);print('finde' if c and t.weekday()==4 and (15,0)<=hm<=(18,30) else 'semana' if c and t.weekday()==6 and (17,30)<=hm<=(20,10) else 'resto' if c and t.weekday()==2 and (17,30)<=hm<=(20,10) else 'avisos')")
            P="--publicar --esperar"
          fi
          echo "tipo=$T" >> $GITHUB_OUTPUT
          echo "args=$P" >> $GITHUB_OUTPUT
          echo "Especial: $T $P"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          bash scripts/instalar_ffmpeg.sh
          pip install -r requirements.txt

      - name: Generar y publicar
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVEN_VOZ_MASCULINA: ${{ vars.ELEVEN_VOZ_MASCULINA }}
          ELEVEN_VOZ_FEMENINA: ${{ vars.ELEVEN_VOZ_FEMENINA }}
          ELEVEN_MODEL: ${{ vars.ELEVEN_MODEL }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_CIFRADO: ${{ secrets.TIKTOK_CIFRADO }}
          UPLOADPOST_API_KEY: ${{ secrets.UPLOADPOST_API_KEY }}
          UPLOADPOST_PERFIL: ${{ vars.UPLOADPOST_PERFIL }}
          UPLOADPOST_PERFIL_ECONOMIA: ${{ vars.UPLOADPOST_PERFIL_ECONOMIA }}
          TIKTOK_MODO: ${{ vars.TIKTOK_MODO || 'borrador' }}
        run: |
          mkdir -p salida_especial
          set -o pipefail
          python -m tiempo.especiales ${{ steps.tipo.outputs.tipo }} ${{ steps.tipo.outputs.args }} 2>&1 | tee salida_especial/registro.txt

      - name: Guardar el vídeo como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: especial-${{ github.run_id }}
          path: |
            salida_especial/*.mp4
            salida_especial/meta.json
            salida_especial/registro.txt
          retention-days: 14
          if-no-files-found: ignore

      - name: Copia en la rama pruebas-especiales (lanzamientos a mano)
        if: always() && github.event_name == 'push'
        run: |
          mkdir -p /tmp/p && cp salida_especial/*.mp4 salida_especial/meta.json salida_especial/registro.txt /tmp/p/ 2>/dev/null || true
          cd /tmp/p && git init -q -b pruebas-especiales
          git config user.name "parte-bot"; git config user.email "parte-bot@users.noreply.github.com"
          git add -A && git commit -qm "Especial $(date +%F-%H%M)" || exit 0
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" pruebas-especiales

      - name: Guardar historial
        if: always()
        run: |
          git config user.name "parte-bot"
          git config user.email "parte-bot@users.noreply.github.com"
          git add historial_especiales/ estado/ docs/hoy.json assets/musica/ 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Especial del $(date +%F)"
          for i in 1 2 3 4; do git pull --rebase -q && git push && break; sleep 5; done
