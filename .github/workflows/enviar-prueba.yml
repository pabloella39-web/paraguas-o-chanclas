name: Enviar la última prueba a TikTok

# Cambiar enviar_prueba.txt manda a TikTok el vídeo guardado en la rama pruebas-tiempo
# (borrador en la bandeja; publicación directa si hay Upload-Post y el archivo no dice "borrador").
on:
  push:
    branches: [main]
    paths: ["enviar_prueba.txt"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: parte-diario
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Descargar la prueba
        run: git clone -q --depth 1 -b pruebas-tiempo "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" /tmp/prueba
      - name: Enviar a TikTok
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_CIFRADO: ${{ secrets.TIKTOK_CIFRADO }}
          UPLOADPOST_API_KEY: ${{ secrets.UPLOADPOST_API_KEY }}
          UPLOADPOST_PERFIL: ${{ vars.UPLOADPOST_PERFIL }}
        run: |
          grep -qi borrador enviar_prueba.txt && export MODO_ENVIO=borrador
          python -m tiempo.enviar_prueba /tmp/prueba
      - name: Guardar token y texto
        if: always()
        run: |
          git config user.name "parte-bot"; git config user.email "parte-bot@users.noreply.github.com"
          git add estado/ docs/hoy.json
          git diff --cached --quiet && exit 0
          git commit -m "Prueba enviada a TikTok"
          for i in 1 2 3 4; do git pull --rebase -q && git push && break; sleep 5; done
