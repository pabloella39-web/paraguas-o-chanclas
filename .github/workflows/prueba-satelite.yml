name: Prueba de imagen de satélite
on:
  push:
    branches: [main]
    paths: ["tiempo/satelite.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  satelite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/instalar_ffmpeg.sh && pip install -r requirements.txt matplotlib scipy
      - run: |
          mkdir -p muestras_satelite
          for d in "$(date +%F):hoy" "2026-10-19:dana_19oct" "2026-10-27:ayer"; do
            python -m tiempo.satelite "${d%%:*}" "muestras_satelite/${d##*:}.jpg" >> muestras_satelite/registro.txt 2>&1 || echo "FALLO ${d}" >> muestras_satelite/registro.txt
          done
      - if: always()
        run: |
          cd muestras_satelite && git init -q -b muestras-satelite
          git config user.name "parte-bot"; git config user.email "parte-bot@users.noreply.github.com"
          git add -A && git commit -qm "Muestras de satélite"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" muestras-satelite
