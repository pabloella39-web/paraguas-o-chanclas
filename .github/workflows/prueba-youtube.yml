name: Prueba de canal de YouTube
on:
  workflow_dispatch:
    inputs:
      canal:
        type: choice
        options: ["historias", "tiempo"]
        default: "historias"
jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          TIKTOK_CIFRADO: ${{ secrets.TIKTOK_CIFRADO }}
        run: python scripts/prueba_youtube.py "${{ inputs.canal }}"
