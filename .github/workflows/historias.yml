name: Historia del día (Lo que Callan las Paredes)

# Lunes, miércoles, viernes, sábado y domingo genera la historia (2-3 partes) y la deja programada en TikTok: la PARTE 1 sale a las 21:00 (Madrid)
# y las demás unos minutos antes, para que en el perfil queden en orden. Varios intentos por si GitHub se retrasa;
# historial_historias/AAAA-MM-DD.json evita repetir.
on:
  schedule:
    - cron: "5 16 * * 0,1,3,5,6"
    - cron: "35 16 * * 0,1,3,5,6"
    - cron: "5 17 * * 0,1,3,5,6"
    - cron: "35 17 * * 0,1,3,5,6"
  push:
    branches: [main]
    paths: ["historias/lanzar.txt"]   # "prueba" = genera sin publicar; "publicar" = genera y programa
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: historias
  cancel-in-progress: false

jobs:
  historia:
    runs-on: ubuntu-latest
    timeout-minutes: 220
    steps:
      - uses: actions/checkout@v4
      - name: Sincronizar con lo último de main (evita repetir lo que otra ejecución acaba de publicar)
        run: git fetch -q origin main && git reset -q --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependencias
        run: |
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          pip install -r requirements.txt
          [ -f assets/historias/SpecialElite-Regular.ttf ] || curl -sfL -o assets/historias/SpecialElite-Regular.ttf \
            https://raw.githubusercontent.com/google/fonts/main/apache/specialelite/SpecialElite-Regular.ttf || true
      - name: Generar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVEN_MODEL: ${{ vars.ELEVEN_MODEL }}
          HISTORIAS_VOZ: ${{ vars.HISTORIAS_VOZ }}
          UPLOADPOST_API_KEY: ${{ secrets.UPLOADPOST_API_KEY }}
          UPLOADPOST_PERFIL_HISTORIAS: ${{ vars.UPLOADPOST_PERFIL_HISTORIAS }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          TIKTOK_CIFRADO: ${{ secrets.TIKTOK_CIFRADO }}
        run: |
          ARGS="--publicar"
          if [ "${{ github.event_name }}" = "push" ] && grep -qi "solo guion" historias/lanzar.txt; then
            mkdir -p salida_historias && python -m historias.main --solo-guion 2>&1 | tee salida_historias/registro.txt
            cd salida_historias && git init -q -b guion-historias && git config user.name "parte-bot" && \
              git config user.email "parte-bot@users.noreply.github.com" && git add -A && git commit -qm guion && \
              git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" guion-historias
            exit 0; fi
          if [ "${{ github.event_name }}" = "push" ] && grep -qi "youtube hoy" historias/lanzar.txt; then
            mkdir -p salida_historias && git fetch -q origin pruebas-historias && mkdir -p /tmp/hoy && git --work-tree=/tmp/hoy checkout origin/pruebas-historias -- . \
              && git reset -q && python -m historias.main --youtube-desde /tmp/hoy 2>&1 | tee salida_historias/registro.txt; exit 0; fi
          # Interruptor: historias/activo.txt = "si" cuando la cuenta de TikTok esté conectada en Upload-Post
          if [ "${{ github.event_name }}" = "schedule" ] && ! grep -qi "^si" historias/activo.txt; then
            echo "::notice::Canal de historias en pausa (historias/activo.txt)"; exit 0; fi
          if [ "${{ github.event_name }}" = "push" ] && ! grep -qi publicar historias/lanzar.txt; then ARGS="--prueba"; export ESPERAR_GUION=0; fi
          if [ "${{ github.event_name }}" = "push" ] && grep -qi " ya" historias/lanzar.txt; then ARGS="--publicar --ya"; fi
          mkdir -p salida_historias
          set -o pipefail
          python -m historias.main $ARGS 2>&1 | grep -v " Render " | tee salida_historias/registro.txt
      - name: Guardar vídeos en la rama pruebas-historias
        if: always()
        run: |
          if ! ls salida_historias/*.mp4 >/dev/null 2>&1; then   # sin vídeos: solo se guarda el registro (para ver fallos)
            [ -f salida_historias/registro.txt ] || exit 0
            mkdir -p /tmp/r && cp salida_historias/registro.txt /tmp/r/ && cd /tmp/r && git init -q -b registro-historias
            git config user.name "parte-bot"; git config user.email "parte-bot@users.noreply.github.com"
            git add -A && git commit -qm "Registro $(date +%F-%H%M)" && \
            git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" registro-historias
            exit 0; fi
          mkdir -p /tmp/p && cp salida_historias/*.mp4 salida_historias/meta.json salida_historias/registro.txt /tmp/p/ 2>/dev/null || true
          cd /tmp/p && git init -q -b pruebas-historias
          git config user.name "parte-bot"; git config user.email "parte-bot@users.noreply.github.com"
          git add -A && git commit -qm "Historia $(date +%F-%H%M)" && \
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" pruebas-historias
      - name: Guardar historial, sonidos y música
        if: always()
        run: |
          git config user.name "parte-bot"; git config user.email "parte-bot@users.noreply.github.com"
          git add historial_historias/ assets/historias/ estado/ 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Historia del $(date +%F)"
          for i in 1 2 3 4; do git pull --rebase -q && git push && break; sleep 5; done
