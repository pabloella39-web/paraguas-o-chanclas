name: Sondeo de avisos
on:
  push:
    branches: [main]
    paths: ["scripts/sondear_avisos.py"]
permissions:
  contents: write
jobs:
  sondeo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: pip install requests && python scripts/sondear_avisos.py 2>&1 | tee registro.txt; mkdir -p muestra_avisos; cp registro.txt muestra_avisos/
      - run: |
          cd muestra_avisos && git init -q -b muestra-avisos
          git config user.name "parte-bot"; git config user.email "parte-bot@users.noreply.github.com"
          git add -A && git commit -qm "Muestra de avisos"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" muestra-avisos
