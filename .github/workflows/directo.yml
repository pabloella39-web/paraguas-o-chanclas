name: Datos del directo
# Mientras hay un directo en marcha: cada 10 minutos actualiza avisos y estaciones de AEMET para la página
# docs/directo (rama directo-datos, que la página lee). Se lanza a mano y se apaga solo.
on:
  workflow_dispatch:
    inputs:
      vueltas:
        description: "Número de actualizaciones (una cada 10 min)"
        default: "30"
permissions:
  contents: write
concurrency:
  group: directo-datos
  cancel-in-progress: true
jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: |
          for i in $(seq 1 ${{ inputs.vueltas }}); do
            python scripts/directo_datos.py || true
            if [ -f directo_datos/datos.json ]; then
              rm -rf /tmp/dd && mkdir /tmp/dd && cp directo_datos/datos.json /tmp/dd/ && cd /tmp/dd
              git init -q -b directo-datos
              git config user.name "parte-bot"; git config user.email "parte-bot@users.noreply.github.com"
              git add -A && git commit -qm "Datos del directo $(date -u +%H:%M)"
              git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" directo-datos || true
              cd "$GITHUB_WORKSPACE"
            fi
            [ "$i" = "${{ inputs.vueltas }}" ] || sleep 600
          done
