name: Parte diario del tiempo

on:
  schedule:
    # El parte de MAÑANA se publica esta noche a las 20:30 (Madrid) en TikTok y YouTube. GitHub solo usa UTC y a veces
    # retrasa ejecuciones: varios intentos; tiempo.horario deja pasar el primero entre las 17:00 y las 20:20 de Madrid
    # si el parte de mañana no existe. La ejecución publica los datos (rama pendiente/parte-FECHA) y espera hasta las
    # 19:50 el guion escrito por la tarea programada de Claude (plan, sin API); si no llega, API de respaldo.
    - cron: "20 15 * * *"
    - cron: "50 15 * * *"
    - cron: "20 16 * * *"
    - cron: "50 16 * * *"
    - cron: "20 17 * * *"
    - cron: "50 17 * * *"
  push:
    # Lanzar un parte a mano desde git: cambiar el archivo lanzar.txt
    branches: [main]
    paths: ["lanzar.txt"]
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar en TikTok"
        type: boolean
        default: false
      esperar:
        description: "Esperar a las 7:30 antes de publicar"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: parte-diario
  cancel-in-progress: false

jobs:
  parte:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Sincronizar con lo último de main (evita repetir lo que otra ejecución acaba de publicar)
        run: git fetch -q origin main && git reset -q --hard origin/main

      - name: Comprobar horario de Madrid
        id: horario
        run: python3 -m tiempo.horario "${{ github.event_name }}" "${{ github.event.schedule }}"

      - uses: actions/setup-python@v5
        if: steps.horario.outputs.ejecutar == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        if: steps.horario.outputs.ejecutar == 'true'
        run: |
          bash scripts/instalar_ffmpeg.sh
          pip install -r requirements.txt

      - name: Generar vídeo y publicar
        if: steps.horario.outputs.ejecutar == 'true'
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
          GOOGLE_WEATHER_API_KEY: ${{ secrets.GOOGLE_WEATHER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          ELEVEN_VOZ_MASCULINA: ${{ vars.ELEVEN_VOZ_MASCULINA }}
          ELEVEN_VOZ_FEMENINA: ${{ vars.ELEVEN_VOZ_FEMENINA }}
          ELEVEN_MODEL: ${{ vars.ELEVEN_MODEL }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_CIFRADO: ${{ secrets.TIKTOK_CIFRADO }}
          UPLOADPOST_API_KEY: ${{ secrets.UPLOADPOST_API_KEY }}
          UPLOADPOST_PERFIL: ${{ vars.UPLOADPOST_PERFIL }}
          UPLOADPOST_PERFIL_ECONOMIA: ${{ vars.UPLOADPOST_PERFIL_ECONOMIA }}
          TIKTOK_MODO: ${{ vars.TIKTOK_MODO || 'borrador' }}
          TIKTOK_PRIVACIDAD: ${{ vars.TIKTOK_PRIVACIDAD || 'PUBLIC_TO_EVERYONE' }}
          GH_PUSH_TOKEN: ${{ github.token }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ARGS="--publicar --vispera --esperar"
          elif [ "${{ github.event_name }}" = "push" ]; then
            ARGS="--publicar"
            # "prueba" en lanzar.txt: vídeo real subido a YouTube como privado, sin TikTok ni historial
            grep -qi prueba lanzar.txt && ARGS="--prueba" && export ESPERAR_GUION=0
            grep -qi "youtube publico" lanzar.txt && export PRUEBA_PUBLICA=1
            # "vispera" en lanzar.txt: el parte de mañana, publicado hoy a las 20:30
            grep -qi vispera lanzar.txt && ARGS="--publicar --vispera --esperar"
          else
            [ "${{ inputs.publicar }}" = "true" ] && ARGS="$ARGS --publicar"
            [ "${{ inputs.esperar }}" = "true" ] && ARGS="$ARGS --esperar"
          fi
          mkdir -p salida
          set -o pipefail
          python -m tiempo.main $ARGS 2>&1 | tee salida/registro.txt

      - name: Guardar la prueba en la rama pruebas-tiempo
        if: always() && github.event_name == 'push'
        run: |
          grep -qi prueba lanzar.txt || exit 0
          mkdir -p /tmp/p && cp salida/*.mp4 salida/meta.json salida/registro.txt /tmp/p/ 2>/dev/null || true
          cd /tmp/p && git init -q -b pruebas-tiempo
          git config user.name "parte-bot"; git config user.email "parte-bot@users.noreply.github.com"
          git add -A && git commit -qm "Prueba $(date +%F-%H%M)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" pruebas-tiempo

      - name: Guardar el vídeo como artefacto
        if: always() && steps.horario.outputs.ejecutar == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: parte-${{ github.run_id }}
          path: |
            salida/*.mp4
            salida/meta.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Guardar historial y token (mantiene vivo el cron del repositorio)
        if: always() && steps.horario.outputs.ejecutar == 'true'
        run: |
          git config user.name "parte-bot"
          git config user.email "parte-bot@users.noreply.github.com"
          git add historial/ estado/ docs/hoy.json assets/musica/ 2>/dev/null || git add historial/
          git diff --cached --quiet && exit 0
          git commit -m "Parte del $(date +%F)"
          # El canal económico también sube cambios: se integra lo remoto antes de subir (si no, se perdería el
          # historial y el siguiente intento programado repetiría el parte)
          for i in 1 2 3 4; do git pull --rebase -q && git push && break; sleep 5; done
