name: Autorizar TikTok

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Pega aquí la URL completa que muestra callback.html tras autorizar"
        required: true
      canal:
        description: "¿Qué cuenta estás autorizando?"
        type: choice
        options: ["tiempo (Paraguas o Chanclas)", "economia (Toro u Oso)"]
        default: "tiempo (Paraguas o Chanclas)"

permissions:
  contents: write

concurrency:
  group: parte-diario
  cancel-in-progress: false

jobs:
  autorizar:
    runs-on: ubuntu-latest
    steps:
      - name: Ocultar el código en los registros
        env:
          URL_CALLBACK: ${{ inputs.url }}
        run: |
          CODE=$(python3 -c "import os,urllib.parse as u;s=os.environ['URL_CALLBACK'];q=u.parse_qs(u.urlparse(s).query);print(q.get('code',[s])[0])")
          echo "::add-mask::$CODE"
          echo "::add-mask::$URL_CALLBACK"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Canjear el código y guardar el token cifrado
        env:
          CODIGO_TIKTOK: ${{ inputs.url }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_CIFRADO: ${{ secrets.TIKTOK_CIFRADO }}
          TIKTOK_ESTADO: ${{ startsWith(inputs.canal, 'economia') && 'tiktok_token_economia.enc' || 'tiktok_token.enc' }}
        run: python -m tiempo.autorizar
      - name: Guardar
        run: |
          git config user.name "parte-bot"
          git config user.email "parte-bot@users.noreply.github.com"
          git add estado/
          git commit -m "Token de TikTok actualizado (cifrado)"
          git push
