<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Texto de hoy · Toro u Oso</title>
<link rel="icon" href="icono-200.png">
<link rel="apple-touch-icon" href="icono-200.png">
<style>
  :root { --fondo:#070d1e; --tarjeta:#16234a; --texto:#fff; --suave:#b9c6e0; --acento:#ffc42d; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--fondo); color:var(--texto);
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding:20px 16px 40px; }
  main { max-width:560px; margin:0 auto; }
  header { display:flex; align-items:center; gap:12px; margin-bottom:18px; }
  header img { width:48px; height:48px; border-radius:50%; }
  h1 { font-size:20px; margin:0; }
  h2 { font-size:17px; margin:22px 0 8px; color:var(--acento); }
  .fecha { color:var(--suave); font-size:14px; margin-top:2px; }
  .texto { background:var(--tarjeta); border-radius:16px; padding:16px; white-space:pre-wrap;
           font-size:16px; line-height:1.5; word-break:break-word; }
  button { width:100%; margin-top:10px; padding:16px; border:0; border-radius:14px; font-size:18px;
           font-weight:800; background:var(--acento); color:#0f1932; cursor:pointer; }
  button:active { transform:scale(.98); }
  .aviso { color:var(--suave); font-size:13px; margin-top:20px; line-height:1.5; }
  .viejo { color:#ffb4a8; font-size:14px; margin:10px 0 0; }
</style>
</head>
<body>
<main>
  <header>
    <img src="icono-200.png" alt="">
    <div>
      <h1>Textos para los posts de hoy</h1>
      <div class="fecha" id="fecha">Cargando…</div>
    </div>
  </header>
  <p class="viejo" id="viejo" hidden>Ojo: estos textos son de otro día. El resumen de hoy aún no se ha generado.</p>
  <div id="ediciones"></div>
  <p class="aviso">Al publicar cada borrador en TikTok, pega su texto en la descripción. La edición de la mañana
    llega hacia las 8:00 y la de la noche hacia las 21:30 (de lunes a viernes).</p>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const NOMBRES = {manana: '☀️ Edición de la mañana', noche: '🌙 Edición de la noche'};
  function bloque(clave, caption) {
    const sec = document.createElement('section');
    const h = document.createElement('h2'); h.textContent = NOMBRES[clave] || clave;
    const t = document.createElement('div'); t.className = 'texto'; t.textContent = caption;
    const b = document.createElement('button'); b.type = 'button'; b.textContent = 'Copiar texto';
    b.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(caption); }
      catch (e) {
        const r = document.createRange(); r.selectNodeContents(t);
        const s = getSelection(); s.removeAllRanges(); s.addRange(r); document.execCommand('copy');
      }
      b.textContent = '¡Copiado! ✅';
      setTimeout(() => b.textContent = 'Copiar texto', 2000);
    });
    sec.append(h, t, b);
    return sec;
  }
  fetch('hoy.json?t=' + Date.now(), {cache: 'no-store'})
    .then(r => r.json())
    .then(d => {
      const f = new Date(d.fecha + 'T12:00:00');
      $('fecha').textContent = f.toLocaleDateString('es-ES', {weekday: 'long', day: 'numeric', month: 'long'});
      const hoy = new Date().toLocaleDateString('sv-SE', {timeZone: 'Europe/Madrid'});
      $('viejo').hidden = d.fecha === hoy;
      const eds = d.ediciones || {[d.edicion || 'manana']: {caption: d.caption}};
      ['noche', 'manana'].forEach(k => { if (eds[k]) $('ediciones').append(bloque(k, eds[k].caption)); });
    })
    .catch(() => { $('fecha').textContent = 'Todavía no hay texto generado.'; });
</script>
</body>
</html>
